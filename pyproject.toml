[project]
name = "research-paper-summarizer-with-chatbot"
version = "0.1.0"
description = "A sophisticated tool to summarize and chat with research papers using AI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "streamlit>=1.30.0",
    "langchain-openai>=0.0.5",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.7.4",
    "pypdf2>=3.0.0",
    "langchain>=0.1.0", 
    "langchain-community>=0.0.20", 
    "langchain-text-splitters>=0.0.1", 
    "pandas>=1.5.0", 
    "sqlalchemy>=2.0.0", 
    "pyarrow>=10.0.0", 
    "openai>=1.0.0", 
    "httpx>=0.24.0", 
    "httpcore>=0.17.0", 
    "gitpython>=3.1.0", 
    "marshmallow>=3.19.0", 
    "dataclasses-json>=0.5.7", 
    "pydantic>=2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
